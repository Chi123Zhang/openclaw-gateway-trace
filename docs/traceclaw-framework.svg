<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#ffffff"/>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
    .sub{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    .head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
    .body{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
    .small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    .box{stroke:#cbd5e1;stroke-width:1.5;rx:18}
    .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="700" y="50" text-anchor="middle" class="title">TraceClaw Framework</text>
  <text x="700" y="80" text-anchor="middle" class="sub">Source-grounded runtime execution analysis for agent systems</text>

  <rect x="45" y="125" width="190" height="175" class="box" fill="#eff6ff"/>
  <text x="140" y="160" text-anchor="middle" class="head">1. Source Code</text>
  <text x="140" y="195" text-anchor="middle" class="body">Inspect real control flow</text>
  <text x="140" y="220" text-anchor="middle" class="body">and execution boundaries</text>
  <text x="140" y="255" text-anchor="middle" class="small">OpenClaw / MAVDR</text>

  <rect x="275" y="125" width="190" height="175" class="box" fill="#ecfdf5"/>
  <text x="370" y="160" text-anchor="middle" class="head">2. Execution Model</text>
  <text x="370" y="195" text-anchor="middle" class="body">Reconstruct source-level</text>
  <text x="370" y="220" text-anchor="middle" class="body">stages and handoffs</text>
  <text x="370" y="255" text-anchor="middle" class="small">e.g. OpenClaw G0–G18</text>

  <rect x="505" y="125" width="190" height="175" class="box" fill="#fffbeb"/>
  <text x="600" y="160" text-anchor="middle" class="head">3. Instrumentation</text>
  <text x="600" y="195" text-anchor="middle" class="body">Capture targeted runtime</text>
  <text x="600" y="220" text-anchor="middle" class="body">events at key boundaries</text>
  <text x="600" y="255" text-anchor="middle" class="small">stage / model / tool / reply</text>

  <rect x="735" y="125" width="190" height="175" class="box" fill="#fff1f2"/>
  <text x="830" y="160" text-anchor="middle" class="head">4. Runtime Events</text>
  <text x="830" y="195" text-anchor="middle" class="body">Collect and correlate</text>
  <text x="830" y="220" text-anchor="middle" class="body">events from one run</text>
  <text x="830" y="255" text-anchor="middle" class="small">run / agent / model / tool</text>

  <rect x="965" y="125" width="190" height="175" class="box" fill="#f5f3ff"/>
  <text x="1060" y="160" text-anchor="middle" class="head">5. Evidence Analysis</text>
  <text x="1060" y="195" text-anchor="middle" class="body">Match runtime evidence</text>
  <text x="1060" y="220" text-anchor="middle" class="body">against the source model</text>
  <text x="1060" y="250" text-anchor="middle" class="small">OBSERVED</text>
  <text x="1060" y="270" text-anchor="middle" class="small">SOURCE-DERIVED / NOT OBSERVED</text>

  <rect x="1195" y="125" width="160" height="175" class="box" fill="#eff6ff"/>
  <text x="1275" y="160" text-anchor="middle" class="head">6. Analysis View</text>
  <text x="1275" y="195" text-anchor="middle" class="body">Inspect the actual</text>
  <text x="1275" y="220" text-anchor="middle" class="body">execution path</text>
  <text x="1275" y="250" text-anchor="middle" class="small">stages · tools</text>
  <text x="1275" y="270" text-anchor="middle" class="small">reply · handoff</text>

  <path d="M235 212 L268 212" class="arrow"/>
  <path d="M465 212 L498 212" class="arrow"/>
  <path d="M695 212 L728 212" class="arrow"/>
  <path d="M925 212 L958 212" class="arrow"/>
  <path d="M1155 212 L1188 212" class="arrow"/>

  <rect x="70" y="365" width="600" height="245" class="box" fill="#f8fafc"/>
  <text x="100" y="405" class="head">Case Study 1 — OpenClaw (current)</text>
  <text x="100" y="435" class="body">Gateway execution model: G0–G18</text>
  <text x="100" y="465" class="body">Authentication → Request Processing → Session &amp; Agent → Runtime Control</text>
  <text x="100" y="490" class="body">→ Context Preparation → Reply Dispatch → Deeper Agent Runtime → Return to G16</text>
  <text x="100" y="530" class="small">Runtime evidence includes Agent, provider/model, tools, final reply, and resolver return.</text>
  <rect x="100" y="555" width="120" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/>
  <text x="160" y="575" text-anchor="middle" class="small">OBSERVED</text>
  <rect x="235" y="555" width="160" height="30" rx="15" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="315" y="575" text-anchor="middle" class="small">SOURCE-DERIVED</text>
  <rect x="410" y="555" width="150" height="30" rx="15" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="485" y="575" text-anchor="middle" class="small">NOT OBSERVED</text>

  <rect x="730" y="365" width="600" height="245" class="box" fill="#fffdf5"/>
  <text x="760" y="405" class="head">Case Study 2 — MAVDR (planned next)</text>
  <text x="760" y="435" class="body">Apply the same execution-analysis model to a six-agent system:</text>
  <text x="760" y="475" class="body">Scanning → Analysis → Repair → Verification → Arbitration → Post-processing</text>
  <text x="760" y="515" class="body">Each agent can expose its internal stages, runtime evidence, tool/model activity,</text>
  <text x="760" y="540" class="body">result, and handoff to the next agent.</text>
  <text x="760" y="580" class="small">Goal: test whether the same source/runtime evidence model transfers beyond OpenClaw.</text>

  <rect x="130" y="650" width="1140" height="42" rx="20" fill="#f1f5f9"/>
  <text x="700" y="677" text-anchor="middle" class="head">Source defines what can happen. Runtime evidence shows what actually happened.</text>
</svg>